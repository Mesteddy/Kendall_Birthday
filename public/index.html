<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kendall's Birthday</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <h1 id="page-title">🎀 It's My Birthday! 🎀</h1>

      <h2 id="birthday-date"></h2>

      <p id="countdown"></p>
    </header>

    <!-- Birthday Gallery -->
    <section>
      <h2>📸 Birthday Memories</h2>

      <div id="gallery" class="birthday-gallery"></div>
    </section>

    <hr />

    <!-- Wishlist -->

    <section class="wishlist">
      <h2>🎁 Birthday Wishlist</h2>

      <p>Want to surprise me with something special?</p>

      <a id="wishlist" href="#" target="_blank"> View My Wishlist </a>
    </section>

    <hr />

    <!-- Google Map -->

    <section class="location-section">
      <h2>📍 Birthday Party Details</h2>

      <div class="location-card">
        <p class="party-time">
          🕒 <strong>Time:</strong>
          <span id="partyTime"></span>
        </p>

        <p id="address" class="address"></p>

        <a id="mapLink" class="map-button" href="#" target="_blank">
          📍 Open in Google Maps
        </a>
      </div>
    </section>

    <hr />

    <footer>
      <p>❤️ Thank you for celebrating with me! ❤️</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
